name: sakinah
description: "Sakīnah — A calmer way to live your faith."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI — Riverpod (see ARCHITECTURE.md for rationale)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Local persistence — Drift (SQLite) for structured/relational data
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Lightweight key-value storage for flags/preferences
  shared_preferences: ^2.3.4

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.2

  # Permissions (location for prayer times/Qibla, notifications for reminders)
  permission_handler: ^11.3.1

  # Hijri date conversion (Home header + Hijri calendar feature)
  hijri: ^3.0.0
  intl: ^0.20.2

  # Prayer times, Qibla & location
  adhan_dart: ^2.0.1
  geolocator: ^14.0.3
  flutter_compass: ^0.8.1

  # Prayer/Adhan local notifications
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0

  # Immutability / value equality without heavy codegen
  equatable: ^2.0.7

  # Icons & visuals
  cupertino_icons: ^1.0.8

  # Logging
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.24.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/data/

  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
